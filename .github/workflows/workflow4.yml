name: Workflow4 - Deploy Azure Container App

on:
  workflow_call:
    inputs:
      image_tag:
        description: Immutable Docker image tag to deploy
        required: true
        type: string
      container_app_name:
        description: Azure Container App name
        required: true
        type: string
      resource_group:
        description: Azure resource group
        required: true
        type: string
      azure_client_id:
        description: Azure managed identity client ID
        required: true
        type: string
      azure_tenant_id:
        description: Microsoft Entra tenant ID
        required: true
        type: string
      azure_subscription_id:
        description: Azure subscription ID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy multi-container revision
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Prepare immutable image tags
        run: sed -i "s/__IMAGE_TAG__/${{ inputs.image_tag }}/g" azure/containerapp.yaml

      - name: Deploy Azure Container App
        shell: bash
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "${{ inputs.container_app_name }}" \
            --resource-group "${{ inputs.resource_group }}" \
            --yaml azure/containerapp.yaml \
            --output none
