name: Workflow1 - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

  publish-api:
    name: Publish API image
    if: github.event_name != 'pull_request' && vars.CICD_ENABLED == 'true'
    needs: test
    uses: ./.github/workflows/workflow2.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit

  publish-frontend:
    name: Publish frontend image
    if: github.event_name != 'pull_request' && vars.CICD_ENABLED == 'true'
    needs: test
    uses: ./.github/workflows/workflow3.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit

  deploy:
    name: Deploy Azure Container Apps
    if: github.event_name != 'pull_request' && vars.CICD_ENABLED == 'true'
    needs: [publish-api, publish-frontend]
    uses: ./.github/workflows/workflow4.yml
    with:
      image_tag: ${{ github.sha }}
      frontend_app_name: ${{ vars.AZURE_FRONTEND_APP_NAME }}
      api_app_name: ${{ vars.AZURE_API_APP_NAME }}
      resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets: inherit
