location: Malaysia West
name: cloudndeploy
properties:
  environmentId: /subscriptions/cd0e253e-3875-4c2e-a288-212059b02943/resourceGroups/deploy/providers/Microsoft.App/managedEnvironments/managedEnvironment-deploy-8003
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      allowInsecure: false
      targetPort: 8080
      transport: auto
  template:
    containers:
      - name: frontend
        image: docker.io/sealovsalad/cloud-deploy-frontend:__IMAGE_TAG__
        env:
          - name: API_UPSTREAM
            value: https://cloudndeploy-api.whitedesert-59fb1aab.malaysiawest.azurecontainerapps.io
        resources:
          cpu: 0.25
          memory: 0.5Gi
    scale:
      minReplicas: 0
      maxReplicas: 1
      rules:
        - name: http-scaler
          http:
            metadata:
              concurrentRequests: "10"
